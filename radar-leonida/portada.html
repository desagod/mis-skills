<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0a0418}
#b{position:relative;width:2560px;height:1440px;overflow:hidden;font-family:"Inter Display",sans-serif;
 background:
  radial-gradient(900px 520px at 50% 108%, rgba(255,170,60,.95), rgba(255,170,60,0) 70%),
  radial-gradient(1400px 700px at 50% 100%, rgba(255,46,136,.9), rgba(255,46,136,0) 70%),
  radial-gradient(900px 700px at 8% 15%, rgba(0,220,255,.35), rgba(0,220,255,0) 70%),
  radial-gradient(900px 700px at 94% 10%, rgba(140,60,255,.45), rgba(140,60,255,0) 70%),
  linear-gradient(180deg,#0d0524 0%,#2a0b4a 45%,#6a1466 72%,#c2186f 100%);}
.stripes{position:absolute;left:0;right:0;bottom:0;height:420px;
 background:repeating-linear-gradient(180deg,rgba(10,4,24,0) 0 26px,rgba(10,4,24,.35) 26px 34px);
 -webkit-mask:linear-gradient(180deg,transparent,#000 60%);}
.streak{position:absolute;height:6px;border-radius:6px;filter:blur(1px);opacity:.7}
.wrap{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
h1{margin:0;font-weight:900;font-style:italic;font-size:178px;line-height:1;letter-spacing:4px;white-space:nowrap;
 background:linear-gradient(180deg,#fff 0%,#ffe7b8 35%,#ff9d4d 65%,#ff2e88 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px rgba(255,46,136,.75)) drop-shadow(8px 8px 0 rgba(0,240,255,.85));}
.sub{font-weight:700;font-size:44px;letter-spacing:12px;color:#fff;text-transform:uppercase;text-shadow:0 0 18px rgba(0,240,255,.9)}
.sub b{color:#00f0ff}
.soc{display:flex;gap:56px;margin-top:6px}
.soc:empty{display:none}
.soc div{display:flex;align-items:center;gap:14px;font-weight:700;font-size:36px;color:#fff}
.soc svg{width:44px;height:44px}
#guide{position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:4px dashed #0f0;display:none}
</style></head><body><div id="b">
<div class="stripes"></div>
<div class="streak" style="left:-100px;top:300px;width:900px;background:linear-gradient(90deg,transparent,#00f0ff)"></div>
<div class="streak" style="right:-80px;top:1080px;width:1000px;background:linear-gradient(270deg,transparent,#ffb347)"></div>
<div class="streak" style="left:-60px;top:1180px;width:700px;background:linear-gradient(90deg,transparent,#ff2e88)"></div>
<div class="streak" style="right:-120px;top:380px;width:760px;background:linear-gradient(270deg,transparent,#b06bff)"></div>
<div class="wrap">
 <h1>RADAR LEONIDA</h1>
 <div class="sub">Noticias <b>·</b> Secretos <b>·</b> Trucos</div>
 <div class="soc" id="soc"></div>
</div>
<div id="guide"></div>
</div>
<script>
// Redes: completar con los usuarios reales cuando existan. Ej: {red:'tiktok', user:'@radarleonida'}
const REDES = [];
const ICON = {
 tiktok:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.6a5.8 5.8 0 1 0 5 5.8V9a7.4 7.4 0 0 0 4.4 1.4V7.2a4.3 4.3 0 0 1-3.3-1.4z"/></svg>',
 instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>',
 youtube:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3z" fill="#c2186f"/></svg>'
};
document.getElementById('soc').innerHTML = REDES.map(r=>`<div>${ICON[r.red]}<span>${r.user}</span></div>`).join('');
if(location.hash==='#guia')document.getElementById('guide').style.display='block';
</script></body></html>
