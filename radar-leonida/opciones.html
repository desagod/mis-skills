<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="o1" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<svg id="o2" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<svg id="o3" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
const star=(cx,cy,R,r=R*.45)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')};
const stars=(cx,cy,R,gap,filled,fill='#ffcc33')=>{let s='';for(let i=0;i<5;i++){const x=cx+(i-2)*gap;s+=i<filled?`<polygon points="${star(x,cy,R)}" fill="${fill}" stroke="#1a1000" stroke-width="5" stroke-linejoin="round"/>`:`<polygon points="${star(x,cy,R)}" fill="none" stroke="${fill}" stroke-opacity=".55" stroke-width="5" stroke-linejoin="round"/>`}return s};
const common=`<filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

// ---------- 1: MINIMAPA ----------
let rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;
o1.innerHTML=`<defs>${common}<clipPath id="c1"><circle cx="540" cy="540" r="430"/></clipPath>
<radialGradient id="pulse"><stop offset="0" stop-color="#00f0ff" stop-opacity=".0"/><stop offset=".8" stop-color="#00f0ff" stop-opacity=".18"/><stop offset="1" stop-color="#00f0ff" stop-opacity=".0"/></radialGradient></defs>
<rect width="1080" height="1080" fill="#0b0b10"/>
<g clip-path="url(#c1)">
 <rect width="1080" height="1080" fill="#2b3a33"/>
 <path d="M110 0 L1080 0 L1080 260 C 900 300 860 380 780 360 C 700 340 690 250 600 230 C 520 210 470 150 380 130 C 300 110 200 60 110 0Z" fill="#14507e"/>
 <path d="M0 640 C 140 610 200 700 260 760 C 320 820 300 900 380 1080 L0 1080Z" fill="#14507e"/>
 <path d="M820 1080 C 860 980 960 940 1080 930 L1080 1080Z" fill="#14507e"/>
 <g stroke="#55665c" stroke-width="10" fill="none">
  <path d="M200 300 L980 300"/><path d="M120 470 L1000 470"/><path d="M200 820 L940 820"/><path d="M300 960 L760 960"/>
  <path d="M330 200 L330 1000"/><path d="M450 160 L450 1000"/><path d="M780 380 L780 1000"/><path d="M900 380 L900 900"/>
 </g>
 <g stroke="#d9d9d9" stroke-width="16" fill="none" stroke-linecap="round">
  <path d="M90 560 L1000 560"/><path d="M620 120 L620 1000"/><path d="M180 900 L620 690 L1000 690"/>
 </g>
 <path d="M140 380 C 360 360 520 420 620 560 C 700 680 860 720 1040 760" stroke="#ff2e88" stroke-width="22" fill="none" stroke-linecap="round" filter="url(#g)"/>
 <circle cx="540" cy="540" r="300" fill="url(#pulse)"/>
 <circle cx="540" cy="540" r="190" fill="none" stroke="#00f0ff" stroke-opacity=".35" stroke-width="4"/>
 <rect x="790" y="230" width="44" height="44" rx="10" fill="#ffcc33" stroke="#1a1000" stroke-width="5"/>
 <text x="812" y="264" font-family="Inter Display" font-weight="900" font-size="32" text-anchor="middle" fill="#1a1000">$</text>
 <circle cx="250" cy="640" r="22" fill="#ff2e88" stroke="#fff" stroke-width="5"/>
</g>
<g transform="translate(540 540) rotate(30)">
 <path d="M0 -70 L48 55 L0 28 L-48 55Z" fill="#fff" stroke="#0b0b10" stroke-width="10" stroke-linejoin="round" filter="url(#g)"/>
</g>
<circle cx="540" cy="540" r="430" fill="none" stroke="#0b0b10" stroke-width="26"/>
<circle cx="540" cy="540" r="444" fill="none" stroke="#ff2e88" stroke-width="10" filter="url(#g)"/>
<g>${stars(540,210,42,92,3)}</g>
<rect x="250" y="800" width="580" height="130" rx="22" fill="#0b0b10" fill-opacity=".9" stroke="#00f0ff" stroke-width="4"/>
<text x="540" y="862" font-family="Inter Display" font-weight="900" font-style="italic" font-size="66" text-anchor="middle" fill="#fff" letter-spacing="5">RADAR</text>
<text x="540" y="910" font-family="Inter Display" font-weight="800" font-size="36" text-anchor="middle" fill="#00f0ff" letter-spacing="12">LEONIDA</text>`;

// ---------- 2: MONOGRAMA ----------
o2.innerHTML=`<defs>${common}
<radialGradient id="bg2" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#3b0d5c"/><stop offset="1" stop-color="#05020a"/></radialGradient>
<linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2e88"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#bg2)"/>
<circle cx="540" cy="540" r="440" fill="none" stroke="#ff2e88" stroke-width="10" filter="url(#g)"/>
<circle cx="540" cy="540" r="410" fill="none" stroke="#00f0ff" stroke-opacity=".5" stroke-width="3"/>
<g>${stars(540,250,38,86,5)}</g>
<g font-family="Inter Display" font-weight="900" font-style="italic" font-size="430" text-anchor="middle" letter-spacing="-20">
 <text x="560" y="720" fill="#00f0ff" opacity=".85">RL</text>
 <text x="540" y="700" fill="url(#txt)" stroke="#05020a" stroke-width="10" paint-order="stroke">RL</text>
</g>
<text x="540" y="840" font-family="Inter Display" font-weight="800" font-size="50" text-anchor="middle" fill="#fff" letter-spacing="14" filter="url(#g)">RADAR LEONIDA</text>`;

// ---------- 3: SKYLINE NOCTURNO ----------
let r=rnd(7),bld='',win='';
const bs=[[150,120,300],[270,90,420],[360,130,360],[490,80,520],[570,140,400],[710,100,470],[810,120,340],[930,100,280]];
for(let [x,w,h] of bs){h=Math.round(h*.72);const y=720-h;bld+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#120726"/><rect x="${x}" y="${y}" width="${w}" height="6" fill="#ff2e88" opacity=".9"/>`;
 for(let yy=y+30;yy<700;yy+=34)for(let xx=x+14;xx<x+w-14;xx+=26)if(r()<.35)win+=`<rect x="${xx}" y="${yy}" width="12" height="16" fill="${r()<.5?'#ffd166':'#00f0ff'}" opacity="${(.5+r()*.5).toFixed(2)}"/>`;}
o3.innerHTML=`<defs>${common}<clipPath id="c3"><circle cx="540" cy="540" r="430"/></clipPath>
<linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090322"/><stop offset=".55" stop-color="#4a1269"/><stop offset=".85" stop-color="#ff2e88"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0f55"/><stop offset="1" stop-color="#05020a"/></linearGradient>
<g id="p3" fill="#05020a"><path d="M0 0 C 8 -110 25 -210 60 -300" stroke="#05020a" stroke-width="18" fill="none" stroke-linecap="round"/>
<g transform="translate(60,-300)"><path d="M0 0 Q 70 -60 160 -10 Q 80 -30 0 8Z"/><path d="M0 0 Q 80 -10 140 70 Q 70 15 0 8Z"/><path d="M0 0 Q -70 -60 -160 -15 Q -80 -30 0 8Z"/><path d="M0 0 Q -80 -5 -140 75 Q -70 15 0 8Z"/><path d="M0 0 Q 20 -80 90 -110 Q 30 -60 6 4Z"/><path d="M0 0 Q -30 -80 -100 -100 Q -35 -55 -6 4Z"/></g></g></defs>
<rect width="1080" height="1080" fill="#05020a"/>
<g clip-path="url(#c3)">
 <rect width="1080" height="720" fill="url(#sky3)"/>
 <circle cx="760" cy="330" r="90" fill="#ffe9b0" opacity=".95" filter="url(#g)"/>
 ${bld}${win}
 <rect y="720" width="1080" height="360" fill="url(#sea)"/>
 <g fill="#ff2e88" opacity=".5"><rect x="420" y="740" width="240" height="6"/><rect x="450" y="770" width="180" height="5"/><rect x="480" y="800" width="120" height="4"/></g>
 <use href="#p3" transform="translate(150,800) scale(1.1)"/><use href="#p3" transform="translate(940,820) scale(-1.15,1.15)"/>
</g>
<circle cx="540" cy="540" r="440" fill="none" stroke="#ff2e88" stroke-width="10" filter="url(#g)"/>
<g>${stars(540,200,34,78,4)}</g>
<g font-family="Inter Display" font-weight="900" font-style="italic" text-anchor="middle" filter="url(#g)">
 <text x="540" y="880" font-size="96" fill="#fff" letter-spacing="6">RADAR</text>
 <text x="540" y="935" font-size="44" fill="#00f0ff" letter-spacing="14">LEONIDA</text>
</g>`;
</script></body></html>
