<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;font-family:"Inter Display",sans-serif}

.scene{position:absolute;inset:0;display:none;overflow:hidden}
.bg{position:absolute;inset:-60px;background:

.rgb span{position:absolute;left:0;right:0;mix-blend-mode:screen}
.rgb .r{color:#ff2e88}.rgb .c{color:#00f0ff}.rgb .w{color:#fff;mix-blend-mode:normal;position:relative}
.stars{display:flex;justify-content:center;gap:16px}
.tag{position:absolute;display:inline-flex;align-items:center;gap:16px;padding:20px 40px;border-radius:999px;font-weight:900;font-style:italic;font-size:56px;letter-spacing:2px;border:5px solid}
.t1{background:linear-gradient(90deg,#ff1f5a,#ff2e88);color:#fff;border-color:#fff;box-shadow:0 0 30px rgba(255,46,136,.8)}
.t2{background:linear-gradient(90deg,#00b8d9,#00f0ff);color:#0a0418;border-color:#0a0418;box-shadow:0 0 30px rgba(0,240,255,.8)}
.live{width:22px;height:22px;border-radius:50%;background:#fff}
.caps{position:absolute;left:60px;right:60px;bottom:330px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px}
.caps b{font-weight:900;font-size:104px;line-height:1.05;color:#fff;text-shadow:0 6px 0 #0a0418,0 0 24px rgba(0,0,0,.7);opacity:0;display:inline-block}
.caps b.hl{color:#ffc94d}
.ov{position:absolute;inset:0;display:none;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,rgba(8,3,20,.9),rgba(8,3,20,0))}
.bot{position:absolute;left:0;right:0;bottom:0;height:560px;background:linear-gradient(0deg,rgba(8,3,20,.9),rgba(8,3,20,0))}
.frame{position:absolute;inset:22px;border:6px solid #ff2e88;border-radius:36px;box-shadow:0 0 24px #ff2e88,inset 0 0 24px rgba(255,46,136,.6)}
.logo{position:absolute;left:78px;top:80px;display:flex;align-items:center;gap:18px;color:#fff;font-weight:900;font-style:italic;font-size:50px;letter-spacing:2px}
.dot{width:40px;height:40px;border-radius:50%;border:4px solid #00f0ff;position:relative;box-shadow:0 0 12px #00f0ff}
.dot:after{content:"";position:absolute;left:12px;top:12px;width:10px;height:10px;border-radius:50%;background:#ff2e88}
.ostars{position:absolute;right:78px;top:88px;display:flex;gap:8px}.ostars svg{width:40px;height:40px}
.note{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:rgba(255,255,255,.6);font-weight:600;font-size:28px}
#fx{position:absolute;inset:0;pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#bars div{position:absolute;left:0;right:0;mix-blend-mode:screen}
.btn{position:absolute;left:50%;top:1330px;transform:translateX(-50%);padding:28px 80px;border-radius:999px;background:#ff2e88;color:#fff;font-weight:900;font-size:60px;letter-spacing:4px;box-shadow:0 0 40px #ff2e88}
</style></head><body><div id="stage">

<div class="scene" id="sI"><div class="bg" id="iBg"></div><div class="stripes"></div><div id="grid" style="position:absolute;inset:0;background:#000"></div><div id="dim" style="position:absolute;inset:0;background:#0a0418;opacity:0"></div>
 <div class="rgb" id="iT" style="top:800px;font-size:160px"></div>
 <div class="stars" id="iS" style="position:absolute;left:0;right:0;top:660px"></div></div>

<div class="scene" id="sA"><div id="cityW" style="position:absolute;inset:0;transform-origin:50% 60%"><svg id="city" width="1080" height="1920"></svg></div>
 <div class="tag t1" id="tagA" style="top:230px"><span class="live"></span>ÚLTIMA HORA</div>
 <div class="caps" id="capA"></div></div>

<div class="scene" id="sB"><div id="mapW" style="position:absolute;inset:0;transform-origin:50% 45%"><svg id="map" width="1080" height="1920"></svg></div>

 <div style="position:absolute;left:0;right:0;top:780px;text-align:center;color:#00f0ff;font-weight:800;font-size:54px;letter-spacing:10px" id="eSub">PARA MÁS DE LEONIDA</div>
 <div style="position:absolute;left:0;right:0;top:900px;text-align:center;color:#fff;font-weight:800;font-size:72px" id="eH"></div>

 <div class="logo"><div class="dot"></div>RADAR LEONIDA</div><div class="ostars"></div></div>

<div id="fx"><svg width="1080" height="1920" style="position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
 <div class="scan"></div><div class="vig"></div><div id="bars"></div><div id="flash"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eBounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const rnd=s=>{const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)};
const STAR='<svg viewBox="0 0 24 24" width="70" height="70"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z" fill="#ffcc33" stroke="#1a1000" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const rgbHTML=txt=>`<span class="r">${txt}</span><span class="c">${txt}</span><span class="w">${txt}</span>`;
$('iT').innerHTML=rgbHTML('RADAR<br>LEONIDA');$('eT').innerHTML=rgbHTML('SÍGUEME');
$('iS').innerHTML=Array(5).fill(`<div>${STAR}</div>`).join('');$('eS').innerHTML=$('iS').innerHTML;
document.querySelector('.ostars').innerHTML=STAR.replace(/70/g,'40').repeat(5);
const caps=(id,words,hl)=>$(id).innerHTML=words.map(w=>`<b class="${hl.includes(w)?'hl':''}">${w}</b>`).join('');
caps('capA',['ASÍ','SE','VERÁN','TUS','NOTICIAS'],['NOTICIAS']);
caps('capB',['ASÍ','SE','VERÁN','TUS','DATOS','CURIOSOS'],['DATOS','CURIOSOS']);
// ciudad
{let r=s=>rnd(s),b='',w='',k=1;const sky=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090322"/><stop offset=".5" stop-color="#4a1269"/><stop offset=".75" stop-color="#ff2e88"/><stop offset=".85" stop-color="#ff9a3d"/></linearGradient><linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0f55"/><stop offset="1" stop-color="#05020a"/></linearGradient>
<g id="pl" fill="#05020a"><path d="M0 0 C 8 -150 30 -290 80 -420" stroke="#05020a" stroke-width="24" fill="none" stroke-linecap="round"/><g transform="translate(80,-420) scale(1.4)"><path d="M0 0 Q 70 -60 160 -10 Q 80 -30 0 8Z"/><path d="M0 0 Q 80 -10 140 70 Q 70 15 0 8Z"/><path d="M0 0 Q -70 -60 -160 -15 Q -80 -30 0 8Z"/><path d="M0 0 Q -80 -5 -140 75 Q -70 15 0 8Z"/><path d="M0 0 Q 20 -80 90 -110 Q 30 -60 6 4Z"/><path d="M0 0 Q -30 -80 -100 -100 Q -35 -55 -6 4Z"/></g></g></defs>
<rect width="1080" height="1250" fill="url(#sk)"/><circle cx="700" cy="560" r="150" fill="#ffe9b0" opacity=".95"/>`;
 for(const [x,wd,h] of [[-20,170,420],[150,130,620],[280,170,500],[450,120,760],[570,190,560],[760,140,680],[900,200,450]]){const y=1250-h;b+=`<rect x="${x}" y="${y}" width="${wd}" height="${h}" fill="#120726"/><rect x="${x}" y="${y}" width="${wd}" height="8" fill="#ff2e88"/>`;
  for(let yy=y+36;yy<1230;yy+=40)for(let xx=x+16;xx<x+wd-16;xx+=30)if(r(k++)<.35)w+=`<rect x="${xx}" y="${yy}" width="14" height="20" fill="${r(k++)<.5?'#ffd166':'#00f0ff'}" opacity="${(.5+r(k++)*.5).toFixed(2)}"/>`;}
 $('city').innerHTML=sky+b+w+`<rect y="1250" width="1080" height="670" fill="url(#se)"/><g fill="#ff2e88" opacity=".5"><rect x="400" y="1280" width="280" height="8"/><rect x="440" y="1320" width="200" height="6"/><rect x="480" y="1360" width="120" height="5"/></g><use href="#pl" transform="translate(60,1450)"/><use href="#pl" transform="translate(1030,1500) scale(-1.1,1.1)"/>`;}
// mapa
$('map').innerHTML=`<rect width="1080" height="1920" fill="#2b3a33"/>
<path d="M0 0 L1080 0 L1080 500 C 900 560 820 700 720 660 C 600 610 560 420 420 380 C 300 340 200 220 0 200Z" fill="#14507e"/>
<path d="M0 1200 C 160 1180 240 1330 300 1460 C 360 1590 320 1760 420 1920 L0 1920Z" fill="#14507e"/>
<g stroke="#55665c" stroke-width="12" fill="none"><path d="M0 760 H1080"/><path d="M0 1000 H1080"/><path d="M0 1560 H1080"/><path d="M300 400 V1920"/><path d="M520 500 V1920"/><path d="M820 700 V1920"/></g>
<g stroke="#d9d9d9" stroke-width="20" fill="none" stroke-linecap="round"><path d="M0 1120 H1080"/><path d="M660 600 V1920"/><path d="M80 1750 L660 1380 L1080 1380"/></g>
<path id="route" d="M180 1700 C 300 1500 420 1260 660 1120 C 820 1020 860 900 840 780" stroke="#ff2e88" stroke-width="26" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 12px #ff2e88)"/>
<circle id="ring1" cx="840" cy="780" r="0" fill="none" stroke="#00f0ff" stroke-width="6"/><circle id="ring2" cx="840" cy="780" r="0" fill="none" stroke="#00f0ff" stroke-width="4"/>
<g id="pin"><path d="M840 780 C 800 720 780 690 780 660 A60 60 0 1 1 900 660 C 900 690 880 720 840 780Z" fill="#ffcc33" stroke="#1a1000" stroke-width="6"/><circle cx="840" cy="660" r="22" fill="#1a1000"/></g>`;
const route=$('route'),RL=route.getTotalLength();route.style.strokeDasharray=RL;

// ---- collage de paneles estilo portada ----
{const W=516,H=618,G=16;const pos=[[G,G],[G*2+W,G],[G,G*2+H],[G*2+W,G*2+H],[G,G*3+H*2],[G*2+W,G*3+H*2]];
const palm=(x,y,s,fl=1)=>`<g transform="translate(${x},${y}) scale(${s*fl},${s})" fill="#05020a"><path d="M0 0 C 8 -110 25 -210 60 -300" stroke="#05020a" stroke-width="18" fill="none" stroke-linecap="round"/><g transform="translate(60,-300)"><path d="M0 0 Q 70 -60 160 -10 Q 80 -30 0 8Z"/><path d="M0 0 Q 80 -10 140 70 Q 70 15 0 8Z"/><path d="M0 0 Q -70 -60 -160 -15 Q -80 -30 0 8Z"/><path d="M0 0 Q -80 -5 -140 75 Q -70 15 0 8Z"/><path d="M0 0 Q 20 -80 90 -110 Q 30 -60 6 4Z"/></g></g>`;
let win='';for(let i=0;i<140;i++){const x=20+(i*37)%480,y=200+((i*53)%380);if(rnd(i)<.55)win+=`<rect x="${x}" y="${y}" width="12" height="16" fill="${rnd(i+99)<.5?'#ffd166':'#00f0ff'}"/>`}
const starsArc=[0,1,2,3,4].map(i=>{const a=Math.PI*(1.15-.075*i*4)/1;const x=258+170*Math.cos(Math.PI*(1-i/4)),y=330-120*Math.sin(Math.PI*(1-i/4))*.9;return `<g transform="translate(${x-45},${y-45}) scale(3.75)"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z" fill="#ffcc33" stroke="#1a1000" stroke-width="1.2" stroke-linejoin="round"/></g>`}).join('');
const P=[
`<defs><linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0b4a"/><stop offset=".55" stop-color="#ff2e88"/><stop offset=".75" stop-color="#ff9a3d"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#p1)"/><circle cx="258" cy="400" r="140" fill="#ffe27a"/><g fill="#ff6a5a"><rect x="100" y="380" width="320" height="10"/><rect x="100" y="410" width="320" height="14"/><rect x="100" y="444" width="320" height="18"/></g><rect y="465" width="${W}" height="160" fill="#3a0f55"/><g fill="#ff2e88" opacity=".6"><rect x="150" y="490" width="220" height="6"/><rect x="190" y="520" width="140" height="5"/></g>${palm(70,640,1.1)}${palm(460,660,1,-1)}`,
`<rect width="${W}" height="${H}" fill="#0d0524"/><circle cx="380" cy="130" r="70" fill="#ffe9b0"/><g fill="#160930"><rect x="0" y="260" width="120" height="400"/><rect x="110" y="180" width="110" height="480"/><rect x="215" y="230" width="120" height="430"/><rect x="330" y="150" width="90" height="510"/><rect x="415" y="250" width="110" height="410"/></g><g fill="#ff2e88"><rect x="110" y="180" width="110" height="6"/><rect x="330" y="150" width="90" height="6"/></g>${win}`,
`<rect width="${W}" height="${H}" fill="#2b3a33"/><path d="M0 0 H${W} V180 C 380 220 300 120 160 140 C 90 150 40 100 0 90Z" fill="#14507e"/><g stroke="#55665c" stroke-width="10"><path d="M0 330 H${W}"/><path d="M0 500 H${W}"/><path d="M140 150 V${H}"/><path d="M380 200 V${H}"/></g><g stroke="#d9d9d9" stroke-width="16"><path d="M0 420 H${W}"/><path d="M260 160 V${H}"/></g><path d="M40 600 C 120 480 200 440 260 420 C 330 390 380 330 380 260" stroke="#ff2e88" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M380 260 C 350 220 335 200 335 180 A45 45 0 1 1 425 180 C 425 200 410 220 380 260Z" fill="#ffcc33" stroke="#1a1000" stroke-width="5"/><circle cx="380" cy="180" r="16" fill="#1a1000"/>`,
`<defs><radialGradient id="p4"><stop offset="0" stop-color="#5a1a8a"/><stop offset="1" stop-color="#12052a"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#p4)"/><circle cx="258" cy="309" r="230" fill="none" stroke="#ff2e88" stroke-width="8"/><circle cx="258" cy="309" r="200" fill="none" stroke="#00f0ff" stroke-width="3" opacity=".7"/>${starsArc}<text x="258" y="450" text-anchor="middle" font-family="Inter Display" font-weight="900" font-style="italic" font-size="64" fill="#fff">BUSCADO</text>`,
`<rect width="${W}" height="${H}" fill="#120726"/><g fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 10px #00f0ff) drop-shadow(0 0 20px #00f0ff)" stroke="#7ff8ff" stroke-width="10"><path d="M258 560 C 250 440 262 330 300 240"/><path d="M300 240 Q 380 190 450 240"/><path d="M300 240 Q 390 260 430 330"/><path d="M300 240 Q 220 180 150 230"/><path d="M300 240 Q 210 250 170 330"/><path d="M300 240 Q 310 160 370 130"/></g><g style="filter:drop-shadow(0 0 10px #ff2e88)" stroke="#ff8fc4" stroke-width="8" fill="none"><path d="M120 560 H400"/></g><text x="258" y="110" text-anchor="middle" font-family="Inter Display" font-weight="900" font-style="italic" font-size="54" fill="#ffd0e8" style="filter:drop-shadow(0 0 10px #ff2e88)">LEONIDA</text>`,
`<defs><linearGradient id="p6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2e88"/></linearGradient></defs><rect width="${W}" height="${H}" fill="#1b0838"/><g fill="#2a0f4f">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="0" y="${i*80}" width="${W}" height="40"/>`).join('')}</g><g font-family="Inter Display" font-weight="900" font-style="italic" font-size="300" text-anchor="middle"><text x="272" y="420" fill="#00f0ff">RL</text><text x="258" y="405" fill="url(#p6)" stroke="#05020a" stroke-width="8" paint-order="stroke">RL</text></g>`];
$('grid').innerHTML=pos.map(([x,y],i)=>`<div class="pn" style="position:absolute;left:${x}px;top:${y}px;width:${W}px;height:${H}px;overflow:hidden;outline:4px solid #000"><svg class="pi" width="${W}" height="${H}" style="transform-origin:50% 50%">${P[i]}</svg></div>`).join('');}
// ---- render ----
window.render=(T,f)=>{const t=T-0.65;
 const show=id=>['sI','sA','sB','sE'].forEach(s=>$(s).style.display=s===id?'block':'none');
 let stage=$('stage'),flash=0,glitch=0,shake=0,blur=0,zoom=1;
 // transitions
 const tri=(t,c,w)=>clamp(1-Math.abs(t-c)/w);
 glitch=Math.max(tri(t,1.35,.18),tri(t,9.6,.18));
 const whip=tri(t,5.65,.16);blur=whip*28;zoom=1+whip*.25;
 flash=Math.max(clamp(1-(t-.45)/.25)*(t>=.45?1:0)*.9, whip*.6, glitch*.3);
 if(t<1.35){show('sI');
  const a=eOut(prog(t,.08,.45));const ti=$('iT');ti.style.transform=`scale(${3-2*a})`;ti.style.opacity=prog(t,.08,.2);
  const off=t<.45?0:Math.max(5,30*clamp(1-(t-.45)/.4));setRGB(ti,off,f);
  shake=t>.45?clamp(1-(t-.45)/.35)*28:0;
  $('iBg').style.transform=`scale(${1+T*.06})`;
  [...document.querySelectorAll('.pn')].forEach((p,i)=>{const k=prog(T,.05+i*.09,.4+i*.09),side=i%2?1:-1;p.style.transform=`translateX(${side*620*(1-eBack(k))}px) rotate(${side*4*(1-k)}deg)`;p.style.opacity=k>0?1:0;p.querySelector('.pi').style.transform=`scale(${1.15-.12*prog(T,0,2)})`});
  $('dim').style.opacity=.6*prog(T,.8,1.05);
  [...$('iS').children].forEach((s,i)=>{const k=prog(t,.6+i*.08,.72+i*.08);s.style.opacity=k;s.style.transform=`scale(${eBack(k)||0})`});
 }else if(t<5.65){show('sA');const k=prog(t,1.35,5.65);
  $('cityW').style.transform=`scale(${1.05+.18*k}) translateY(${-30*k}px)`;
  const tg=eBack(prog(t,1.6,1.95));$('tagA').style.left=(-750+820*tg)+'px';
  words('capA',t,2.0,.24);
 }else if(t<9.6){show('sB');const k=prog(t,5.65,9.6);
  $('mapW').style.transform=`scale(${1.35-.3*eOut(k)}) rotate(${-4+4*eOut(k)}deg)`;
  route.style.strokeDashoffset=RL*(1-eOut(prog(t,6.0,7.5)));
  const pd=prog(t,7.5,8.1);$('pin').style.transform=`translateY(${-260*(1-eBounce(pd))}px)`;$('pin').style.opacity=pd>0?1:0;
  [['ring1',8.1],['ring2',8.45]].forEach(([id,s])=>{const q=((t-s)%0.9+0.9)%0.9/0.9;const on=t>s;$(id).setAttribute('r',on?20+110*q:0);$(id).style.opacity=on?1-q:0});
  const tg=eBack(prog(t,5.9,6.25));$('tagB').style.right=(-800+870*tg)+'px';
  words('capB',t,6.3,.24);
 }else{show('sE');
  const a=eOut(prog(t,9.7,10.0));const ti=$('eT');ti.style.transform=`scale(${2.4-1.4*a})`;ti.style.opacity=prog(t,9.7,9.8);
  setRGB(ti,t<10?0:Math.max(4,24*clamp(1-(t-10)/.4)),f);
  if(t>10&&t<10.3)shake=(1-(t-10)/.3)*22; if(t>=10&&t<10.2)flash=Math.max(flash,(1-(t-10)/.2)*.7);
  $('eSub').style.opacity=prog(t,10.2,10.5);
  const h='@radarleonida',n=Math.floor(h.length*prog(t,10.4,11.1));$('eH').textContent=h.slice(0,n)+(n<h.length&&n>0?'|':'');
  [...$('eS').children].forEach((s,i)=>{const k=prog(t,10.9+i*.1,11.05+i*.1);s.style.opacity=k;s.style.transform=`scale(${eBack(k)||0})`});
  const bk=prog(t,11.4,11.7);$('eB').style.opacity=bk;$('eB').style.transform=`translateX(-50%) scale(${(eBack(bk)||0)*(1+.05*Math.sin((t-11.7)*9)*(t>11.7))})`;
 }
